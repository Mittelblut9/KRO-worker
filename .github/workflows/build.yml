name: KommtRumathraOnline.de Build

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                ref: main
                fetch-depth: 0

            - name: login to hub  
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push (Web)
              uses: docker/build-push-action@v4
              with:
                context: .
                file: ./.docker/Dockerfile.web
                push: true
                tags: mittelblut9/kommtrumathraonline-web:latest

            - name: Build and push (Worker)
              uses: docker/build-push-action@v4
              with:
                context: .
                file: ./.docker/Dockerfile.worker
                push: true
                tags: mittelblut9/kommtrumathraonline-worker:latest